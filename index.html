<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>FOOD SERVICE</h1>
    <form>
    <div class="box">
        <div class="box2">
        <h2>Hello!</h2><br>
        <h4>Sign Up to Get Started</h4><br>
        </div>
        
        <label for="username"></label>
        <input id="username" type="text" placeholder="    Full name" minlength="4" required><br>

        <label for="email"></label>
        <input type="email" id="email" placeholder="    Email Address" required><br>

        <label for="password"></label>
        <input type="password" id="password" placeholder="    Password" minlength="8" maxlength="12" required><br>

        <input type="reset">
        <input type="submit">
        
    </div>
    </form>
</body>
</html>
